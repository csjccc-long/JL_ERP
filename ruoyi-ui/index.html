<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="/favicon.ico">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #222;
      padding: 0.2em 0;
    }

    /* ---- 首屏加载：系统 logo 旋转 ---- */
    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      gap: 20px;
    }

    #loader {
      width: 64px;
      height: 64px;
      -webkit-animation: logo-spin 1.05s linear infinite;
      animation: logo-spin 1.05s linear infinite;
      will-change: transform;
    }

    #loader img {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loader-wrapper .load_title {
      font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      color: #161618;
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: 0.02em;
      text-align: center;
    }

    #loader-wrapper .load_title span {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 400;
      font-style: normal;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9a9da1;
    }

    @-webkit-keyframes logo-spin {
      from {
        -webkit-transform: rotate(0deg);
        transform: rotate(0deg);
      }

      to {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }

    @keyframes logo-spin {
      from {
        -webkit-transform: rotate(0deg);
        transform: rotate(0deg);
      }

      to {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #loader {
        -webkit-animation-duration: 2.4s;
        animation-duration: 2.4s;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div id="loader">
        <img src="/logo-swirl.png" alt="金流智能 ERP" />
      </div>
      <div class="load_title">正在加载系统资源<span>Loading</span></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
