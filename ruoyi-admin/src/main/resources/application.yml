# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 52MB
      # 设置总上传的文件大小
      max-request-size: 60MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: ${ERP_REDIS_HOST:localhost}
      # 端口，默认为6379
      port: ${ERP_REDIS_PORT:6379}
      # 数据库索引
      database: ${ERP_REDIS_DATABASE:0}
      # 密码
      password: ${ERP_REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${ERP_JWT_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# 健康检查（ERP 基础服务探针，不触发模型生成，不泄露内部细节）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: true

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/erp/*
# 金流智能 ERP 业务配置
erp:
  # 知识库文档与业务附件根目录
  upload-path: ${ERP_UPLOAD_PATH:D:/ruoyi/uploadPath/erp}
  # 单文件上限（字节），默认 50MB
  max-file-size: 52428800
  # 允许上传的扩展名
  allowed-extensions: pdf,doc,docx,xls,xlsx,txt,png,jpg,jpeg
  # 单号前缀
  supplier-prefix: SUP
  contract-prefix: CT
  request-prefix: PR
  order-prefix: PO
  receipt-prefix: RC
  # 低库存阈值
  low-stock-threshold: 10

# RAGFlow 知识引擎配置（Key 只在服务端保存，不下发浏览器）
ragflow:
  # 服务地址
  base-url: ${RAGFLOW_BASE_URL:http://127.0.0.1:9380}
  # 租户 API Key
  api-key: ${RAGFLOW_API_KEY:}
  # 固定 ERP 助手 Chat ID，为空时按 chat-name 自动查找或创建
  chat-id: ${RAGFLOW_CHAT_ID:}
  chat-name: ERP Enterprise Assistant
  # 连接与读取超时（秒）
  connect-timeout-seconds: 5
  read-timeout-seconds: ${RAGFLOW_TIMEOUT_SECONDS:90}
  # 失败重试次数与轮询间隔
  retry-max: ${RAGFLOW_RETRY_MAX:3}
  poll-interval-ms: 15000
  # 检索参数
  similarity-threshold: 0.2
  vector-similarity-weight: 0.3
  page-size: 10
  # 携带的最近对话轮数
  history-rounds: 10
  # 生成模型名称（仅用于审计记录）
  model-name: ${CHAT_MODEL:}
